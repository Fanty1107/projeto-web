<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filmes — LetterMoe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="../styles/global.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR (igual em todas as páginas, só muda o "active") -->
  <nav class="navbar navbar-expand-lg sticky-top app-navbar">
    <div class="container">
      <a class="navbar-brand" href="home.html">LetterMoe</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="home.html">Início</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="filmes.html">Filmes</a></li>
          <li class="nav-item"><a class="nav-link" href="series.html">Séries</a></li>
          <li class="nav-item"><a class="nav-link" href="animes.html">Animes</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="cat-filmes">
    <!-- CARROSSEL -->
    <section class="hero" aria-label="Filmes em destaque">
      <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="6000">
        <div class="carousel-indicators" id="heroIndicators"></div>
        <div class="carousel-inner" id="heroSlides">
          <div class="carousel-item active">
            <div class="hero-slide hero-slide--vazio">
              <div class="container hero-conteudo">
                <h1 class="hero-titulo">Filmes</h1>
              </div>
            </div>
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Próximo</span>
        </button>
      </div>
    </section>

    <!-- BUSCA + FILTRO DE GÊNERO -->
    <section class="container busca-wrap">
      <form id="formBusca" class="busca card p-3" role="search">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-6">
            <label for="buscaTexto" class="visually-hidden">Título do filme</label>
            <input id="buscaTexto" type="search" class="form-control" placeholder="Buscar filme pelo nome">
          </div>
          <div class="col-12 col-md-3">
            <label for="buscaGenero" class="visually-hidden">Gênero</label>
            <select id="buscaGenero" class="form-select">
              <option value="">Todos os gêneros</option>
            </select>
          </div>
          <div class="col-6 col-md-2 d-grid">
            <button class="btn btn-accent" type="submit"><i class="bi bi-search me-1"></i>Buscar</button>
          </div>
          <div class="col-6 col-md-1 d-grid">
            <button class="btn btn-outline-light" type="button" id="btnLimpar" aria-label="Limpar busca"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>
      </form>
    </section>

    <div class="container" id="avisoErro"></div>

    <!-- RESULTADOS DA BUSCA (aparece só quando o usuário busca) -->
    <section class="container secao d-none" id="resultados" aria-labelledby="tResultados">
      <div class="secao-topo">
        <h2 id="tResultados">Resultados</h2>
      </div>
      <p id="msgBusca" class="text-body-secondary d-none"></p>
      <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-6 g-3" id="gridBusca"></div>
      <div class="text-center mt-4">
        <button class="btn btn-outline-light d-none" type="button" id="btnMais">Carregar mais</button>
      </div>
    </section>

    <!-- LISTAS PADRÃO -->
    <div id="listasPadrao">
      <section class="container secao" aria-labelledby="tAlta">
        <div class="secao-topo"><h2 id="tAlta">Em alta na semana</h2></div>
        <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-6 g-3" id="gridAlta"></div>
      </section>

      <section class="container secao" aria-labelledby="tMelhores">
        <div class="secao-topo"><h2 id="tMelhores">Mais bem avaliados</h2></div>
        <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-6 g-3" id="gridMelhores"></div>
      </section>

      <section class="container secao" aria-labelledby="tCartaz">
        <div class="secao-topo"><h2 id="tCartaz">Em cartaz</h2></div>
        <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-6 g-3" id="gridCartaz"></div>
      </section>
    </div>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p class="mb-1">Dados fornecidos por <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.</p>
      <p class="mb-0 small text-body-secondary">Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/filmes.js"></script>
</body>
</html>
